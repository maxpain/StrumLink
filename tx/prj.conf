# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Guitar TX"
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_MAX_CONN=2

# SoftDevice Controller with LLPM
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_CTLR_SDC_LLPM=y
CONFIG_BT_HCI_VS_EVT_USER=y

# Auto-update connection params
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Increase TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Memory (LLPM sample uses 2048)
CONFIG_HEAP_MEM_POOL_SIZE=2048

# GPIO (11 buttons need 11 GPIOTE channels)
CONFIG_GPIO=y
CONFIG_NRFX_GPIOTE_NUM_OF_EVT_HANDLERS=11

# Logging (set to 3 for debug)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0

# USB CDC ACM console
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y

# System OFF (deep sleep) after idle timeout
CONFIG_POWEROFF=y

# Optimize for speed
CONFIG_SPEED_OPTIMIZATIONS=y
