# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Guitar TX"
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_MAX_CONN=2

# SoftDevice Controller with LLPM
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_CTLR_SDC_LLPM=y
CONFIG_BT_HCI_VS_EVT_USER=y

# Auto-update connection params
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Increase TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Memory (LLPM sample uses 2048)
CONFIG_HEAP_MEM_POOL_SIZE=2048

# GPIO
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# USB CDC ACM console
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y

# Optimize for speed
CONFIG_SPEED_OPTIMIZATIONS=y
