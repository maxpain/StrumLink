# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Guitar TX"
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_MAX_CONN=2
CONFIG_BT_CONN_PARAM_ANY=y

# SoftDevice Controller with LLPM
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_CTLR_SDC_LLPM=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=3000
CONFIG_BT_HCI_VS_EVT_USER=y

# Don't overwrite LLPM params with standard BLE defaults
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=n

# TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# DC/DC regulator
CONFIG_REGULATOR=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=2048

# GPIO
CONFIG_GPIO=y
CONFIG_NRFX_GPIOTE_NUM_OF_EVT_HANDLERS=11

# System OFF (deep sleep) after idle timeout
CONFIG_POWEROFF=y

# Speed optimization (overridden by release.conf with size opt)
CONFIG_SPEED_OPTIMIZATIONS=y
