# RX Release overlay — minimum latency, no serial console
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_ASSERT=n
CONFIG_RESET_ON_FATAL_ERROR=y

# Disable CDC ACM — pure HID gamepad (better iOS/console compatibility)
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
